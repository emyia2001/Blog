name: Deploy worker

on:
  push:
    branches: [main]
  schedule:
    # 每天 UTC 21:30（北京时间约 05:30）；非整点避开 Actions 调度拥堵。
    # 定时重建用于刷新构建期数据（GitHub 贡献热力图）。
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GITHUB_CONTRIB_TOKEN: ${{ secrets.GITHUB_CONTRIB_TOKEN }}
        run: npm run build

      # 不用 cloudflare/wrangler-action@v3：它内置默认 wrangler 3.90.0（不支持只有 assets、
      # 没有 main 的纯静态资源 Worker，会报 Missing entry-point 后 exit 1），
      # 且失败时把 wrangler 的真实报错吞进注解里。直接起 wrangler，报错可见、版本可控。
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 凭证自检：secret 缺失时直接给结论，而不是让 wrangler 抛一句晦涩的 exit 1
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::secrets.CLOUDFLARE_API_TOKEN 未配置或为空"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::secrets.CLOUDFLARE_ACCOUNT_ID 未配置或为空"; exit 1; }
          echo "API token 已注入（长度 ${#CLOUDFLARE_API_TOKEN}），accountId=${CLOUDFLARE_ACCOUNT_ID}"
          npx --yes wrangler@4.156.2 --version
          # 失败时把 wrangler 报错的最后几行写进注解：这样不展开日志也能直接看到原因
          if ! npx --yes wrangler@4.156.2 deploy 2>&1 | tee /tmp/wrangler.log; then
            msg=$(tail -n 6 /tmp/wrangler.log | tr '\n' ' ' | tr -s ' ')
            echo "::error::wrangler deploy 失败：${msg}"
            exit 1
          fi
