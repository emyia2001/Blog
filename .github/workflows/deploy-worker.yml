name: Deploy worker

on:
  push:
    branches: [main]
  schedule:
    # 每天 UTC 21:30（北京时间约 05:30）；非整点避开 Actions 调度拥堵。
    # 定时重建用于刷新构建期数据（GitHub 贡献热力图）。
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # GitHub 不允许 secret 名以 GITHUB_ 开头（保留前缀），所以仓库里存的是 CONTRIB_TOKEN；
          # 注进构建进程时仍用 GITHUB_CONTRIB_TOKEN —— contributions.ts 读的是这个名字。
          GITHUB_CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
          # 热力图取数走了哪条路径，写进注解：静默回退公开抓取时（私有仓库贡献不计入）
          # 在运行摘要里就能看见，不用翻构建日志。
          if grep -q '\[heatmap\] GraphQL ok' /tmp/build.log; then
            echo "::notice::$(grep -o '\[heatmap\] GraphQL ok.*' /tmp/build.log | head -1)"
          elif grep -q '\[heatmap\] 未读到 GITHUB_CONTRIB_TOKEN' /tmp/build.log; then
            echo "::warning::未配置 GITHUB_CONTRIB_TOKEN：热力图回退公开抓取，私有仓库贡献不会计入"
          elif grep -q '\[heatmap\] 主路径失败' /tmp/build.log; then
            echo "::warning::$(grep -o '\[heatmap\] 主路径失败.*' /tmp/build.log | head -1)"
          elif grep -q '\[heatmap\] 公开抓取 ok' /tmp/build.log; then
            echo "::warning::$(grep -o '\[heatmap\] 公开抓取 ok.*' /tmp/build.log | head -1)（不含私有仓库贡献）"
          else
            echo "::warning::热力图留空：GraphQL 与公开抓取都失败，见构建日志"
          fi

      # 不用 cloudflare/wrangler-action@v3：它内置默认 wrangler 3.90.0（不支持只有 assets、
      # 没有 main 的纯静态资源 Worker，会报 Missing entry-point 后 exit 1），
      # 且失败时把 wrangler 的真实报错吞进注解里。直接起 wrangler，报错可见。
      # wrangler 由 devDependencies 提供（版本随 package-lock 锁定），无需每次联网现装。
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 凭证自检：secret 缺失时直接给结论，而不是让 wrangler 抛一句晦涩的 exit 1
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::secrets.CLOUDFLARE_API_TOKEN 未配置或为空"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::secrets.CLOUDFLARE_ACCOUNT_ID 未配置或为空"; exit 1; }
          echo "API token 已注入（长度 ${#CLOUDFLARE_API_TOKEN}），accountId=${CLOUDFLARE_ACCOUNT_ID}"
          npx --no-install wrangler --version
          # 失败时把 wrangler 报错的最后几行写进注解：这样不展开日志也能直接看到原因
          if ! npx --no-install wrangler deploy 2>&1 | tee /tmp/wrangler.log; then
            msg=$(tail -n 6 /tmp/wrangler.log | tr '\n' ' ' | tr -s ' ')
            echo "::error::wrangler deploy 失败：${msg}"
            exit 1
          fi
