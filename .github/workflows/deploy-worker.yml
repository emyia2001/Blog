name: Deploy worker

on:
  push:
    branches: [main]
  schedule:
    # 每天 UTC 21:30（北京时间约 05:30）；非整点避开 Actions 调度拥堵。
    # 定时重建用于刷新构建期数据（GitHub 贡献热力图）。
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GITHUB_CONTRIB_TOKEN: ${{ secrets.GITHUB_CONTRIB_TOKEN }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 必须显式指定：wrangler-action@v3 内置默认值是 3.90.0（DEFAULT_WRANGLER_VERSION），
          # 而该版本无法部署「纯静态资源」Worker（wrangler.jsonc 只有 assets、没有 main），
          # 会直接报 Missing entry-point 并以 exit code 1 结束。
          wranglerVersion: "4.156.2"
          command: deploy
