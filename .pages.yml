media:
  input: public/images
  output: /images

content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename:
      template: "{slug}.mdx"
      field: false
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: slug
        label: 链接 slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "只能用英文小写、数字和连字符，如 hello-world"
        help: "英文短链接，如 hello-world（决定 /blog/xxx 的网址）"
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
      - name: excerpt
        label: 摘要（必填，用于列表、分享卡与相关文章）
        type: text
        required: true
      - name: heroImage
        label: 封面图 URL
        type: string
        help: "可填 img.snark.casa 外链；留空则无封面"
      - name: articleLayout
        label: 布局
        type: select
        options:
          values: [sidebar]
        default: sidebar
      - name: tags
        label: 标签
        # Pages CMS 2.x 没有 type: list；数组用字段级 list: true 声明，
        # 每个元素按 type 渲染（这里即字符串输入框），最终写回 string[]。
        type: string
        list: true
      - name: draft
        label: 草稿（不发布）
        type: boolean
        default: false
      - name: featured
        label: 置顶
        type: boolean
        default: false
      - name: dropCap
        label: 首字下沉
        type: boolean
        default: true
        help: "关闭后正文首段不做下沉首字"
      - name: bgm
        label: 背景音乐
        type: object
        fields:
          - name: src
            type: string
          - name: title
            type: string
      - name: graph
        label: 关系图谱
        type: object
        fields:
          - name: name
            type: string
          - name: avatar
            type: string
          - name: enabled
            type: boolean
      - name: body
        label: 正文
        type: rich-text

  - name: moments
    label: 纪事
    type: collection
    path: src/content/moments
    format: yaml-frontmatter
    filename:
      template: "moment-{year}-{month}-{day}.mdx"
      field: false
    view:
      primary: date
      sort: date
      order: desc
    fields:
      - name: type
        label: 类型
        type: select
        required: false
        default: event
        options:
          values: [person, event, diary]
          labels: [人物, 事件, 日记]
        help: "人物/事件为回顾型节点（进图谱与归档）；日记为日常流水（只进时间线）"
      - name: title
        label: 标题（日记可留空，缺省用日期）
        type: string
        required: false
      - name: date
        label: 日期（记录当天，必填）
        type: date
        required: true
      - name: excerpt
        label: 摘要（可留空）
        type: text
        required: false
      - name: heroImage
        label: 封面图 URL
        type: string
        required: false
        help: "可填 img.snark.casa 外链；留空则无封面"
      - name: draft
        label: 草稿
        type: boolean
        default: false
      - name: bgm
        label: 背景音乐（可选）
        type: object
        required: false
        fields:
          - name: src
            type: string
          - name: title
            type: string
      - name: lock
        label: 加密（可选）
        type: object
        required: false
        help: "填了 question+answer 后，正文会在构建时加密；浏览器端输对答案才显示。answer 建议用长且唯一的句子（勿用单词/生日）"
        fields:
          - name: question
            label: 谜面/提示（公开显示）
            type: string
          - name: answer
            label: 答案（即密码，不会写入页面）
            type: string
      - name: graph
        label: 关系图谱（可选，人物/事件有效）
        type: object
        required: false
        fields:
          - name: name
            type: string
          - name: avatar
            type: string
          - name: enabled
            type: boolean
      - name: body
        label: 正文
        type: rich-text
